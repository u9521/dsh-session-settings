name: Build and Deploy Release Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent race conditions when pushing to the dist branch
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm run build

      - name: Deploy to dist branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Create a temporary staging directory
          STAGE_DIR=$(mktemp -d)

          # Copy minimal runtime-required files only
          mkdir -p "$STAGE_DIR/lib"
          cp lib/index.js lib/client.js "$STAGE_DIR/lib/"
          cp cordis.patch.yml LICENSE "$STAGE_DIR/"

          # Generate sanitized minimal package.json for runtime distribution
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete pkg.scripts;
            delete pkg.devDependencies;
            delete pkg.types;
            if (pkg.exports && pkg.exports["."]) {
              pkg.exports["."] = "./lib/index.js";
            }
            pkg.files = ["lib", "cordis.patch.yml", "README.md", "LICENSE"];
            fs.writeFileSync("'"$STAGE_DIR"'/package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

          # Generate minimal README pointing to main GitHub repository
          cat << 'EOF' > "$STAGE_DIR/README.md"
          # dsh-session-settings (Release Branch)

          Prebuilt runtime distribution artifacts for **[dsh-session-settings](https://github.com/u9521/dsh-session-settings)**.

          ## 🚀 Quick Install

          ```sh
          dsh plugin --profile web add github:u9521/dsh-session-settings#dist
          ```

          ## 📖 Documentation & Source Code

          For full documentation, usage instructions, source code, and issue tracker, please visit the main repository:

          👉 **[https://github.com/u9521/dsh-session-settings](https://github.com/u9521/dsh-session-settings)**

          ## 📄 License

          [MIT License](LICENSE)
          EOF

          # Switch to an orphan release branch and clean all untracked/ignored files
          git checkout --orphan dist
          git rm -rf . > /dev/null 2>&1 || true
          git clean -fdx

          # Move staged files into the root
          cp -r "$STAGE_DIR"/* .
          rm -rf "$STAGE_DIR"

          # Commit and force push to dist branch
          git add -A
          git commit -m "release: build from ${GITHUB_SHA::7}"
          git push origin HEAD:dist --force
